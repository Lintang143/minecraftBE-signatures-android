name: Cari String Khusus & AoB

on:
  workflow_dispatch:

jobs:
  search-strings:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Repo
        uses: actions/checkout@v4

      - name: Instal Tool (Radare2 & Python3)
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 python3

      - name: Unduh Binary 500MB
        run: |
          OWNER="Lintang143"
          REPO="libminecraftpe"
          TAG="v1.0.0"
          curl -fSL -O "https://github.com/${OWNER}/${REPO}/releases/download/${TAG}/libminecraftpe.so"

      - name: Cari String & Ekstrak AoB
        run: |
          python3 -c '
          import subprocess
          import json
          import os

          so_file = "libminecraftpe.so"
          
          # Daftar string yang mau dicari
          target_strings = [
              "Player", "hurt", "Fall", "Bright", 
              "Gamma", "ClientInstance", "LocalPlayer", "Actor"
          ]

          results = {}

          print("Memulai pencarian string...")

          for target in target_strings:
              print(f"[-] Mencari string: {target}")
              
              # izzj = cari string di seluruh binary, lalu filter pakai jq via python
              cmd_str = ["r2", "-q", "-c", f"/j {target}", so_file]
              try:
                  raw_out = subprocess.check_output(cmd_str).decode("utf-8")
                  str_matches = json.loads(raw_out) if raw_out.strip() else []
              except Exception as e:
                  str_matches = []

              target_data = []

              # Ambil maksimal 10 match pertama per string agar output tidak meledak
              for m in str_matches[:10]:
                  vaddr = m.get("vaddr") or m.get("offset")
                  if not vaddr:
                      continue

                  # pdj 5 @ vaddr = Ambil 5 instruksi assembly (AoB + opcode) di sekitar string tersebut
                  cmd_dism = ["r2", "-q", "-c", f"pdj 5 @ {vaddr}", so_file]
                  try:
                      dism_out = subprocess.check_output(cmd_dism).decode("utf-8")
                      dism_json = json.loads(dism_out)
                  except:
                      dism_json = []

                  target_data.append({
                      "string_address": hex(vaddr),
                      "string_found": m.get("string", target),
                      "instructions_aob": dism_json
                  })

              results[target] = target_data

          os.makedirs("output_search", exist_ok=True)
          with open("output_search/found_strings_aob.json", "w") as f:
              json.dump(results, f, indent=2)

          print("Selesai! Hasil disimpan di output_search/found_strings_aob.json")
          '

      - name: Upload Hasil Search ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-strings-aob
          path: output_search/found_strings_aob.json
